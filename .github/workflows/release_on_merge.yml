name: Release on Merge to Main

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout main branch
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run build
              run: pnpm run build

            - name: Run tests
              run: pnpm run test

            - name: Get package metadata
              id: package
              run: |
                  echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"
                  echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

            - name: Make get_changelog.sh executable
              run: chmod +x ./get_changelog.sh

            - name: Get release changelog
              run: |
                  ./get_changelog.sh "${{ steps.package.outputs.version }}" > release-notes.md
                  test -s release-notes.md

            - name: Check whether the package version is already published
              id: npm
              run: |
                  if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version --json >/dev/null 2>&1; then
                    echo "published=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "published=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Publish to npm
              if: steps.npm.outputs.published != 'true'
              run: pnpm publish --no-git-checks --provenance
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Create or update GitHub Release
              run: |
                  tag="v${{ steps.package.outputs.version }}"

                  if gh release view "$tag" >/dev/null 2>&1; then
                    gh release edit "$tag" \
                      --title "Release $tag" \
                      --notes-file release-notes.md
                  else
                    gh release create "$tag" \
                      --target "$GITHUB_SHA" \
                      --title "Release $tag" \
                      --notes-file release-notes.md
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
